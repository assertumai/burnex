version: 1
kind: discussion-strategy
name: item-design
description: >
  Обсуждение пункта очереди до реализации: прагматик и скептик предлагают
  подход независимо, автор сводит и защищает черновик, спорное решает и итог
  пишет арбитр на старшей модели.
# Две семьи моделей без привязки файлов петли к плагину: прагматик и автор черновика
# называют только уровень модели и идут на агенте машины по умолчанию
# (defaults.agent домашнего конфига — на машине разработки это Codex), а
# скептическая сторона и арбитр называют claude явно; арбитр — его старшая
# модель (max — Fable). Бэкенд codex здесь назвать нельзя: он плагин, а файлы
# петли обязаны раскрываться и без него (test/loop-portability.test.ts).
participants:
  - id: pragmatist
    model_tier: deep
    focus: >
      Самое простое решение, которое выполняет признак готовности пункта:
      существующие слои, типы и команды раньше новых; минимум новых сущностей
      и публичной поверхности; что из пункта вынести в отдельный пункт очереди,
      если он велик для одного захода.
  - id: skeptic
    agent: claude
    model_tier: deep
    focus: >
      Что сломается первым: обратная совместимость, потребители изменяемого
      контракта, отказы и граничные случаи, сгенерированное в dist/, проверяемость признака готовности объявленной командой
      проверки, цена реализации против бюджета захода.
author:
  model_tier: deep
  prompt: >
    Своди честно: отклонённые варианты участников не теряй, у каждой точки
    решения называй, чем выбранный вариант лучше отклонённого именно для этого
    пункта очереди. Точки решения — только те, от которых зависит реализация.
aggregator:
  agent: claude
  model_tier: max
  prompt: >
    Ты выносишь финальное решение. Спорные точки решай сам по доводам и
    доказательствам из кода, а не по числу голосов; решение спорной точки
    записывай с причиной, почему отклонён другой вариант. agreed ставь false
    только если решения несовместимы и согласованно их не пересобрать — тогда
    пункт не реализуется: заход получает отказ, а перечень unresolved остаётся
    в журнале шага для человека.
    Пиши документ так, чтобы по нему можно было завести описание изменения:
    конкретные файлы, контракты и проверки, без общих слов.
rounds: 1
