version: 1
kind: review-strategy
name: change-review
description: >
  Ревью изменения петли саморазвития двумя ревьюерами с разным фокусом —
  расхождения со спекой и корректность, регрессии и дыры в тестах; итог и
  спорное — за арбитром на старшей модели.
# Две семьи моделей без привязки файлов петли к плагину: ревьюер correctness
# называют только уровень модели и идут на агенте машины по умолчанию
# (defaults.agent домашнего конфига — на машине разработки это Codex), а
# скептическая сторона и арбитр называют claude явно; арбитр — его старшая
# модель (max — Fable). Бэкенд codex здесь назвать нельзя: он плагин, а файлы
# петли обязаны раскрываться и без него (test/loop-portability.test.ts).
reviewers:
  - id: correctness
    model_tier: deep
    focus: >
      Расхождения с планом и требованиями спеки (заявленное поведение, которого
      в коде нет, и поведение, которого нет в спеке), ошибки корректности,
      граничные случаи, обработка отказа, нарушенные инварианты, задачи плана,
      отмеченные выполненными без реализации.
  - id: compatibility
    agent: claude
    model_tier: deep
    focus: >
      Регрессии и обратная совместимость: потребители изменённых контрактов и
      схем, тихая деградация вместо внятного отказа, сценарии спеки без теста,
      тесты, которые проходят и без изменения, правки за объявленными
      границами.
aggregator:
  agent: claude
  model_tier: max
  prompt: file:../prompts/change-review-aggregate.md
# independent, а не defend: работы петли идут каждая в своём дереве
# (workspace.scope: job), и защитником была бы не сессия имплементатора, а
# свежий агент (other_tree) — лишние ходы без памяти о реализации.
mode: independent
