# Приёмка адаптера Copilot на живом CLI. Как запускать — README.md рядом:
# плагин объявляется во временном проекте, а не в конфигурации этого
# репозитория.
#
# Один дешёвый вызов. Что проверяется: запуск с --allow-all создаёт файл в
# рабочем дереве, а текст ответа из двух абзацев (пустая строка между ними)
# доходит до журнала целиком — это работа события text ядра.

version: 1
kind: pipeline
name: acceptance-copilot

workspace:
  mode: cwd

budget:
  wallclock: 10m

defaults:
  agent: copilot

jobs:

  пишет:
    description: Создаёт файл и отвечает двумя абзацами
    steps:
      - id: файл-и-ответ
        agent: copilot
        prompt: "Создай в текущем каталоге файл notes.txt с одной строкой «привет». Затем ответь ровно двумя абзацами, разделёнными пустой строкой: в первом скажи, что создал, во втором — что записал в файл."
        timeout: 5m
        expect:
          - file_exists: notes.txt
