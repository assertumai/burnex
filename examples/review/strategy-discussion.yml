version: 1
kind: review-strategy
name: strategy-discussion
description: Безопасность на Codex и тесты на Claude обсуждают находки; итог сводит Claude
reviewers:
  - id: security
    agent: codex
    model_tier: balance
    focus: Границы доверия, секреты в логах, инъекции
  - id: tests
    agent: claude
    model_tier: balance
    focus: file:./tests-focus.md
aggregator:
  agent: claude
  model_tier: balance
  prompt: Вердикт request_changes, если есть хотя бы одна находка critical или major.
mode: discussion
discussion:
  max_messages: 3
