# Работа: свести дорожки, наложив каждую на дерево проекта по очереди.
#
# Режим переопределён на cwd на месте подключения: наложение и проверка идут
# в дереве проекта, а не в снимке. needs называет verify обеих дорожек явно,
# on: always — дорожка, чей propose не запустился (слот пуст), даёт verify
# статусом skipped, а не success, и без always work merge не запустилась бы
# вовсе.
#
# Команда проверки доходит подстановкой ${project.check}, раскрытой при
# разборе пайплайна, — не через конфигурацию: `merge-lanes` принимает её
# ключом `--check` и по-прежнему ничего не знает о том, чем проверяется этот
# конкретный репозиторий. Кавычки вокруг подстановки те же, что были вокруг
# литерала: значение доезжает до `sh -c` как есть, экранирование сложной
# команды — на её авторе (см. docs/config.md).
#
# --lanes all, а не перечень имён: добавленная в пайплайн дорожка сводится
# без правки этой работы, а перечень, набранный руками, мог разойтись с
# дорожками, объявленными пайплайном, — забытая в нём буква проходит свою
# цепочку и пропадает без следа.
#
# Параметр onto — ветка, на текущую вершину которой сводятся дорожки
# (`merge-lanes --onto`, его задаёт scripts/self-improve-loop.sh). Ключ
# добавляется ветвлением sh только при непустом значении, как --only в
# pick-lanes работы slots: при пустом команда прежняя. Грязную копию --onto
# пережидает сам, поэтому предусловия чистоты здесь нет. Значение подставляется
# в sh -c без экранирования: скрипт пропускает только имена веток из
# [A-Za-z0-9._/-], ручной вход onto — на совести набравшего, как --only.

version: 1
kind: job
name: merge
description: Наложить дорожки по очереди, проверить и закоммитить зелёную

params:
  onto: { type: string, default: '' }

steps:
  - id: merge-lanes
    run:
      [
        sh,
        -c,
        'if [ -n "${params.onto}" ]; then ONTO="--onto ${params.onto}"; else ONTO=""; fi; "$STEPCAST_BIN" merge-lanes "$STEPCAST_RUN_ID" --lanes all $ONTO --check "${project.check}"',
      ]
    # Объявленная команда гоняется внутри, на дорожку, дважды при двух
    # дорожках — запас кратно щедрее, чем у одиночного verify.
    timeout: 30m
    expect: [{ exit_code: 0 }]
